name: lit-digest

on:
  schedule:
    # A cada 3 dias, 08:00 UTC (ajuste o fuso/horário se quiser).
    - cron: "0 8 */3 * *"
  workflow_dispatch: {}   # botão "Run workflow" para rodar manualmente

# Necessário para o agente commitar docs/data de volta (atualiza o GitHub Pages).
permissions:
  contents: write

concurrency:
  group: lit-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python main.py

      # Commita o histórico atualizado (alimenta o dashboard no GitHub Pages
      # e serve como memória de deduplicação entre execuções).
      - name: Commit dashboard data
        run: |
          git config user.name  "lit-monitor-bot"
          git config user.email "actions@github.com"
          git add docs/data/articles.json docs/data/meta.json
          if git diff --staged --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "data: atualiza dashboard ($(date -u +%Y-%m-%d)) [skip ci]"
            git push
          fi

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: |
            output/
            docs/data/articles.json
          if-no-files-found: warn
          retention-days: 90
